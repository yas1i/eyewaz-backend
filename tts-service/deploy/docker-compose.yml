# EYEWAZ self-hosted Urdu TTS — Hetzner (or any Docker host) deployment.
#
#   docker compose up -d --build
#
# The engine listens on 127.0.0.1:8090 ONLY. It is reached from the internet
# through the host's existing Caddy (see Caddyfile in this folder for the site
# block to add), so the port is never open to the world.
#
# DO NOT add a Caddy container here. The production box already runs Caddy on
# 80/443 for the WAJD sites, and a second one would fight it for those ports.
services:
  tts:
    build: ..
    image: eyewaz-tts:piper
    container_name: eyewaz-tts-piper
    restart: unless-stopped
    # Hard memory ceiling. WITHOUT ONE, a long synthesis run grew this process to
    # 1.9 GB and the HOST out-of-memory killer fired (9 Sep 2026, dmesg shows
    # "global_oom ... Killed process (uvicorn)"). This box has 4 GB, no swap, and
    # also serves wajd.co.uk, learn, skills, group, analytics, voice, quran,
    # forge, shield, homeschool and the Mazdurr API, so an unbounded container
    # here is an estate-wide outage risk. Measured normal load: a 3,600-character
    # document peaks near 293 MB. 1 GB is generous headroom; the point is that
    # the container dies alone rather than taking the host with it.
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      - PORT=8090
      - VOICES_DIR=/srv/voices
      # Required. The EYEWAZ backend must send the same value as SELF_HOST_TTS_KEY.
      - TTS_API_KEY=${TTS_API_KEY:?set TTS_API_KEY in deploy/.env}
    volumes:
      # The trained .onnx voices live on the host, not in the image.
      - ${VOICES_HOST_DIR:-/opt/eyewaz-tts/voices}:/srv/voices:ro
    ports:
      - "127.0.0.1:8090:8090"
